<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DinoDEX — Swap, Earn, Explore</title>
  <style>
    :root{--bg:#0b0f14;--card:#131a22;--line:#1e2833;--txt:#e6edf3;--dim:#8b98a5;--acc:#22c55e;--acc2:#16a34a}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
    header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
    .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
    .logo .dino{font-size:22px}
    .connect-evm{background:var(--acc);color:#04120a;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
    .connect-evm:hover{background:var(--acc2);color:#fff}
    main{max-width:460px;margin:40px auto;padding:0 20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
    .card h2{font-size:16px;margin-bottom:14px}
    .row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
    .row .lbl{color:var(--dim);font-size:12px}
    .row .val{font-weight:600}
    .swapbtn{width:100%;margin-top:14px;background:var(--acc);color:#04120a;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:15px;cursor:pointer}
    .swapbtn:hover{background:var(--acc2);color:#fff}
    .muted{color:var(--dim);font-size:12px;text-align:center;margin-top:18px}
    #status{margin-top:12px;font-size:13px;color:var(--acc);text-align:center;min-height:18px}
    footer{text-align:center;color:var(--dim);font-size:12px;padding:24px}
  </style>
</head>
<body>
  <header>
    <div class="logo"><span class="dino">🦖</span> DinoDEX</div>
    <button class="connect-evm">Connect Wallet</button>
  </header>

  <main>
    <div class="card">
      <h2>Swap</h2>
      <div class="row">
        <div><div class="lbl">You pay</div><div class="val">Any Token</div></div>
        <div class="val">MAX</div>
      </div>
      <div class="row">
        <div><div class="lbl">You receive</div><div class="val">Best Route</div></div>
        <div class="val">DEX</div>
      </div>
      <button class="swapbtn">Swap</button>
      <div id="status"></div>
    </div>
    <p class="muted">Audited router · Non-custodial · MEV protected</p>
  </main>

  <footer>© 2025 DinoDEX — swap across 12 chains</footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
